# Publishes the game to GitHub Pages on every push to master.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deploy finish; skip queued ones in between.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No build step: the game is static files. Copy only what the browser needs.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r src _site/src
          mkdir -p _site/assets
          cp -r assets/audio _site/assets/audio
          cp -r assets/textures _site/assets/textures
          cp -r assets/vehicles _site/assets/vehicles

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
